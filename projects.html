---
layout: default
title: Projects
permalink: /projects/
---

<header>
  <h1>Projects</h1>
  <p class="secondary"><a href="{{ '/' | relative_url }}">&larr; Back to Home</a></p>
</header>

<section class="posts-list" aria-label="Projects">
  <ul style="list-style: none; padding: 0;">
    {% assign projects = site.projects | sort: 'date' | reverse %}
    {% for project in projects %}
      <li style="margin-bottom: 1.5rem; display: flex; flex-direction: column;">
        <span class="post-date" style="color: #888888; font-size: 0.9rem; margin-bottom: 0.2rem;">{{ project.date | date: "%Y-%m-%d" }}</span>
        <a href="{{ project.url | relative_url }}" style="text-decoration: none; font-weight: 500; font-size: 1.1rem;">{{ project.title | escape }}</a>
      </li>
    {% endfor %}
  </ul>
</section>
